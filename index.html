<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ed">
  <title>카키브로우 계좌번호 복사</title>
  <style>
    :root { color-scheme: light; --ink:#3d3028; --muted:#786b60; --paper:#fbf9f4; --line:#e7dfd4; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:22px; background:#f2eee6; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
    main { width:min(100%,380px); padding:28px 22px; background:var(--paper); border:1px solid var(--line); border-radius:20px; text-align:center; box-shadow:0 10px 28px rgba(61,48,40,.06); }
    .brand { margin:0 0 8px; font-size:12px; letter-spacing:.2em; font-weight:750; }
    h1 { margin:0; font-size:22px; letter-spacing:-.04em; }
    p { color:var(--muted); font-size:14px; line-height:1.65; }
    button { width:100%; margin-top:16px; padding:17px 14px; border:0; border-radius:12px; background:var(--ink); color:#fff; font-size:16px; font-weight:750; cursor:pointer; }
    button:focus-visible { outline:3px solid #b89b7b; outline-offset:3px; }
    #status { min-height:22px; margin:12px 0 0; color:#376849; font-size:13px; }
    .hint { margin:8px 0 0; font-size:12px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">KHAKI BROW</p>
    <h1>계좌번호 복사</h1>
    <p>아래 버튼을 누른 뒤<br>은행 앱의 계좌번호 입력란에 붙여넣어 주세요.</p>
    <button id="copyButton" type="button">계좌번호 복사하기</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="hint">복사한 뒤 매장에 표시된 은행과 예금주를 확인해 주세요.</p>
  </main>
  <script>
    const account = "3333-22-7518553";
    const button = document.getElementById("copyButton");
    const status = document.getElementById("status");
    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(account);
        status.textContent = "계좌번호가 복사되었습니다.";
      } catch (e) {
        const field = document.createElement("textarea");
        field.value = account;
        field.setAttribute("readonly", "");
        field.style.position = "fixed";
        field.style.opacity = "0";
        document.body.appendChild(field);
        field.select();
        const ok = document.execCommand("copy");
        field.remove();
        status.textContent = ok ? "계좌번호가 복사되었습니다." : "자동 복사가 되지 않으면 계좌번호 복사 기능을 다시 시도해 주세요.";
      }
    });
  </script>
</body>
</html>
